[package]
name = "devin-usage-tray"
version = "0.1.0"
edition = "2024"

# 默认带 GUI（托盘+面板）；VPS/headless 构建用 --no-default-features 得到纯采集器
[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui_plot", "dep:image", "dep:tray-icon",
       "dep:winit", "dep:arboard"]

[dependencies]
# 采集器（无 GUI 依赖）
serde_json = "1"
ureq = { version = "3", features = ["json"] }
csv = "1"
sha1 = "0.10"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }

# GUI（default feature）
arboard = { version = "3.6.1", optional = true }
eframe = { version = "0.32", optional = true }
egui_plot = { version = "0.33", optional = true }
image = { version = "0.25.10", default-features = false, features = ["png"], optional = true }
tray-icon = { version = "0.25.1", optional = true }
winit = { version = "0.30.13", optional = true }
